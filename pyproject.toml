[tool.ruff]
line-length = 140
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]

[tool.ruff.lint.per-file-ignores]
"atlas/collect.py" = ["E501"]  # le script PowerShell embarqué garde ses longues lignes
"atlas/findings.py" = ["E501"]
"tools/check_scan.py" = ["E501"]
"atlas/gui/widgets.py" = ["E501"]  # tracés SVG des icônes
"atlas/gui/theme.py" = ["E501"]  # feuille de style Qt
"atlas/locale_en.py" = ["E501"]  # catalogue de traduction : une phrase par ligne, plus lisible

[tool.pytest.ini_options]
testpaths = ["tests"]

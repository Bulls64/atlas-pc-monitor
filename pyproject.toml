[tool.ruff]
line-length = 140
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]

[tool.ruff.lint.per-file-ignores]
"atlas/collect.py" = ["E501"]  # le script PowerShell embarqué garde ses longues lignes
"atlas/findings.py" = ["E501"]
"tools/check_scan.py" = ["E501"]  # messages en français, plus lisibles d'un seul tenant

[tool.pytest.ini_options]
testpaths = ["tests"]

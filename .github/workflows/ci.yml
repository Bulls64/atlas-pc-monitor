name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  linux:
    name: Lint et tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: xvfb-run -a python -m pytest -q

  windows-tests:
    name: Tests Windows (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest pytest-qt -r requirements.txt
      - run: python -m pytest -q -rs

  windows-scan:
    name: Inventaire réel sur Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Inventaire JSON (journal de débogage)
        shell: pwsh
        run: |
          python atlas_pc.py --json -o scan.json --debug
          Copy-Item (Join-Path $env:TEMP "atlas-debug.log") atlas-debug.log
      - name: Vérification de l'inventaire
        shell: pwsh
        run: |
          python tools/check_scan.py scan.json | Tee-Object -FilePath check.md
          $code = $LASTEXITCODE
          Get-Content check.md | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $code
      - name: Exports, fiche et mode partage
        shell: pwsh
        run: |
          python atlas_pc.py --text -o rapport.txt
          python atlas_pc.py --html -o rapport.html
          python atlas_pc.py --fiche -o fiche.html --client "CI" --technicien "GitHub Actions"
          python atlas_pc.py --json --anonyme -o scan-anonyme.json
          Get-Content rapport.txt -TotalCount 40
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inventaire-windows
          path: |
            scan.json
            scan-anonyme.json
            atlas-debug.log
            check.md
            rapport.txt
            rapport.html
            fiche.html

  windows-build:
    name: Exécutables Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller pillow -r requirements.txt
      - name: Icône
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/make_icon.py build/atlas-pc-monitor.ico
      - name: Dossier (onedir)
        run: pyinstaller atlas_pc.spec --noconfirm
      - name: Lancer le dossier construit
        shell: pwsh
        run: |
          # Exécutable fenêtré : on attend explicitement la fin du processus.
          # Windowed executable: the end of the process is awaited explicitly.
          $p = Start-Process -FilePath dist\AtlasPCMonitor\AtlasPCMonitor.exe -ArgumentList "--json", "-o", "built.json" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "AtlasPCMonitor.exe (dossier) a renvoyé $($p.ExitCode)" }
          python tools/check_scan.py built.json
          # Export PDF par l'exe (mise en page Qt) à partir du rapport qu'il vient d'écrire.
          # PDF export by the exe (Qt layout) from the report it has just written.
          $p = Start-Process -FilePath dist\AtlasPCMonitor\AtlasPCMonitor.exe -ArgumentList "built.json", "--pdf", "-o", "built.pdf" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Export PDF (dossier) : code $($p.ExitCode)" }
          $head = [System.Text.Encoding]::ASCII.GetString((Get-Content built.pdf -AsByteStream -TotalCount 4))
          if ($head -ne "%PDF" -or (Get-Item built.pdf).Length -lt 10000) { throw "built.pdf invalide" }
          # Propriétés de l'exe (onglet « Détails ») : même version que le code.
          # Exe properties ("Details" tab): same version as the code.
          $version = python -c "import atlas; print(atlas.__version__)"
          $info = (Get-Item dist\AtlasPCMonitor\AtlasPCMonitor.exe).VersionInfo
          if ($info.ProductVersion -ne $version -or $info.ProductName -ne "Atlas PC Monitor") { throw "Propriétés de l'exe : $($info.ProductName) $($info.ProductVersion)" }
          # Licences à côté de l'exécutable, en plus de celles du dossier _internal.
          # Licenses next to the executable, in addition to those in the _internal folder.
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md dist\AtlasPCMonitor\
          Compress-Archive -Path dist\AtlasPCMonitor -DestinationPath AtlasPCMonitor-windows.zip
      - name: Fichier unique (onefile)
        env:
          ATLAS_ONEFILE: "1"
        run: pyinstaller atlas_pc.spec --noconfirm
      - name: Lancer le fichier unique
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\AtlasPCMonitor.exe -ArgumentList "--json", "-o", "onefile.json" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "AtlasPCMonitor.exe (fichier unique) a renvoyé $($p.ExitCode)" }
          python tools/check_scan.py onefile.json
          $p = Start-Process -FilePath dist\AtlasPCMonitor.exe -ArgumentList "onefile.json", "--pdf", "-o", "onefile.pdf" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Export PDF (fichier unique) : code $($p.ExitCode)" }
          if ((Get-Item onefile.pdf).Length -lt 10000) { throw "onefile.pdf invalide" }
          Get-Item dist\AtlasPCMonitor.exe, AtlasPCMonitor-windows.zip | Format-Table Name, @{n="Mo"; e={[math]::Round($_.Length / 1MB, 1)}}
      - uses: actions/upload-artifact@v7
        with:
          name: AtlasPCMonitor-windows
          path: |
            AtlasPCMonitor-windows.zip
            dist/AtlasPCMonitor.exe

  linux-appimage:
    name: Paquets Linux (AppImage, .deb, .rpm)
    # Ubuntu 22.04 (glibc 2.35) : l'AppImage tourne sur toutes les distributions au moins aussi récentes.
    # Ubuntu 22.04 (glibc 2.35): the AppImage runs on every distribution at least as recent.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bibliothèques X11 de Qt (embarquées) et outils
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q squashfs-tools rpm xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libegl1
      - run: python -m pip install pyinstaller pytest -r requirements.txt
      - run: tools/build_appimage.sh
      - run: tools/build_linux_packages.sh
      - name: Essayer l'AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"  # les machines de la CI n'ont pas FUSE — the CI machines have no FUSE
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "tests")
          from conftest import PAYLOAD
          from atlas import collect, export
          collect.is_windows = lambda: True
          data = collect.scan(runner=lambda: (0, json.dumps(PAYLOAD), ""))
          open("exemple.json", "w", encoding="utf-8").write(export.to_json(data))
          PY
          app=$(ls dist/AtlasPCMonitor-*-x86_64.AppImage)
          "$app" --version
          "$app" --text exemple.json | grep -q "CONSTATS"
          "$app" --fiche exemple.json -o fiche.html && grep -q "Fiche d'intervention" fiche.html
          # PDF sans serveur graphique : Qt passe seul en mode « offscreen ».
          # PDF without a display server: Qt switches to "offscreen" on its own.
          env -u DISPLAY -u WAYLAND_DISPLAY "$app" exemple.json --pdf -o rapport.pdf && head -c 4 rapport.pdf | grep -q "%PDF"
          # Interface sur un vrai serveur X : elle doit s'ouvrir et rester ouverte.
          # Interface on a real X server: it must open and stay open.
          xvfb-run -a sh -c "\"$app\" exemple.json & pid=\$!; sleep 10; kill -0 \$pid && kill \$pid"
          ls -la "$app"
      - name: Installer le paquet .deb sur Ubuntu 22.04
        run: |
          sudo apt-get install -y -q ./dist/atlas-pc-monitor_*_amd64.deb
          sh tests/check_linux_package.sh exemple.json
          sudo apt-get remove -y -q atlas-pc-monitor
          test ! -e /opt/atlas-pc-monitor
          ls -la dist/*.deb dist/*.rpm
      - uses: actions/upload-artifact@v7
        with:
          name: AtlasPCMonitor-linux
          path: |
            dist/AtlasPCMonitor-*-x86_64.AppImage
            dist/atlas-pc-monitor_*_amd64.deb
            dist/atlas-pc-monitor-*.x86_64.rpm
      - uses: actions/upload-artifact@v7
        with:
          name: essai-paquets
          path: |
            exemple.json
            tests/check_linux_package.sh

  linux-install:
    name: Installer le paquet (${{ matrix.image }})
    # Installation réelle avec le gestionnaire de paquets de chaque distribution : les dépendances
    # déclarées doivent se résoudre, l'interface s'ouvrir et le PDF s'écrire sans écran.
    # Real installation with each distribution's package manager: the declared dependencies must
    # resolve, the interface must open and the PDF must be written without a display.
    needs: linux-appimage
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            install: apt-get update -q && apt-get install -y -q ./atlas-pc-monitor_*_amd64.deb xvfb xauth
            remove: apt-get remove -y -q atlas-pc-monitor
          - image: fedora:latest
            install: dnf install -y -q ./atlas-pc-monitor-*.x86_64.rpm xorg-x11-server-Xvfb xorg-x11-xauth
            remove: dnf remove -y -q atlas-pc-monitor
          - image: opensuse/leap:15.6
            install: zypper --non-interactive install --allow-unsigned-rpm ./atlas-pc-monitor-*.x86_64.rpm xvfb-run
            remove: zypper --non-interactive remove atlas-pc-monitor
    steps:
      # Sans checkout : les images minimales n'ont pas toujours git ni tar.
      # No checkout: minimal images do not always have git or tar.
      - uses: actions/download-artifact@v8
        with:
          name: AtlasPCMonitor-linux
          path: artefacts
      - uses: actions/download-artifact@v8
        with:
          name: essai-paquets
          path: essai
      - name: Installer
        run: cp artefacts/*.deb artefacts/*.rpm . && sh -c "${{ matrix.install }}"
      - name: Essayer
        run: sh essai/tests/check_linux_package.sh essai/exemple.json
      - name: Désinstaller
        run: sh -c "${{ matrix.remove }}" && test ! -e /opt/atlas-pc-monitor && test ! -e /usr/bin/atlas-pc-monitor


  release:
    name: Publication (tag v*)
    # Un tag « v1.0.0 » poussé publie une release GitHub avec les exécutables vérifiés plus haut.
    # Pushing a "v1.0.0" tag publishes a GitHub release with the executables checked above.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows-tests, windows-scan, windows-build, linux-appimage, linux-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artefacts
          merge-multiple: true
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Le tag doit correspondre à la version du code.
          # The tag must match the version in the code.
          code=$(python3 -c "import atlas; print(atlas.__version__)")
          [ "$code" = "$version" ] || { echo "Tag $GITHUB_REF_NAME, mais le code est en version $code" >&2; exit 1; }
          # Notes de la release : la section de cette version dans CHANGELOG.md, puis les fichiers.
          # Release notes: this version's section in CHANGELOG.md, then the files.
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {on = 1; next} on && /^## \[/ {exit} on && !/^\[/' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "Pas de section [$version] dans CHANGELOG.md" >&2; exit 1; }
          cat >> notes.md <<'NOTES'

          ### Downloads · Téléchargements

          - `AtlasPCMonitor.exe`: single file for Windows 10/11, run it directly · fichier unique pour Windows 10/11, à lancer directement.
          - `AtlasPCMonitor-windows.zip`: the same application as a folder, faster start and fewer antivirus warnings · la même application en dossier, démarrage plus rapide et moins d'alertes antivirus.
          - `AtlasPCMonitor-*-x86_64.AppImage`: report viewer for Linux (glibc 2.35 or later) · visionneuse de rapports pour Linux (glibc 2.35 ou plus).
          - `atlas-pc-monitor_*_amd64.deb`: the same viewer as a package for Debian, Ubuntu, Linux Mint · la même visionneuse en paquet pour Debian, Ubuntu, Linux Mint.
          - `atlas-pc-monitor-*.x86_64.rpm`: the same viewer as a package for Fedora, openSUSE · la même visionneuse en paquet pour Fedora, openSUSE.
          - `SHA256SUMS.txt`: fingerprints of the files above · empreintes des fichiers ci-dessus.

          The executables are not code-signed: SmartScreen may ask for confirmation (More info → Run anyway). · Les exécutables ne sont pas signés : SmartScreen peut demander une confirmation (Informations complémentaires → Exécuter quand même).
          NOTES
          cp artefacts/dist/AtlasPCMonitor.exe artefacts/AtlasPCMonitor-windows.zip artefacts/AtlasPCMonitor-*-x86_64.AppImage .
          cp artefacts/atlas-pc-monitor_*_amd64.deb artefacts/atlas-pc-monitor-*.x86_64.rpm .
          files="AtlasPCMonitor.exe AtlasPCMonitor-windows.zip $(ls AtlasPCMonitor-*-x86_64.AppImage atlas-pc-monitor_*_amd64.deb atlas-pc-monitor-*.x86_64.rpm)"
          sha256sum $files > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Atlas PC Monitor $version" --notes-file notes.md \
            $files SHA256SUMS.txt

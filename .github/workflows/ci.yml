name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  linux:
    name: Lint et tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: xvfb-run -a python -m pytest -q

  windows-tests:
    name: Tests Windows (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest pytest-qt -r requirements.txt
      - run: python -m pytest -q -rs

  windows-scan:
    name: Inventaire réel sur Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inventaire JSON (journal de débogage)
        shell: pwsh
        run: |
          python atlas_pc.py --json -o scan.json --debug
          Copy-Item (Join-Path $env:TEMP "atlas-debug.log") atlas-debug.log
      - name: Vérification de l'inventaire
        shell: pwsh
        run: |
          python tools/check_scan.py scan.json | Tee-Object -FilePath check.md
          $code = $LASTEXITCODE
          Get-Content check.md | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $code
      - name: Exports, fiche et mode partage
        shell: pwsh
        run: |
          python atlas_pc.py --text -o rapport.txt
          python atlas_pc.py --html -o rapport.html
          python atlas_pc.py --fiche -o fiche.html --client "CI" --technicien "GitHub Actions"
          python atlas_pc.py --json --anonyme -o scan-anonyme.json
          Get-Content rapport.txt -TotalCount 40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventaire-windows
          path: |
            scan.json
            scan-anonyme.json
            atlas-debug.log
            check.md
            rapport.txt
            rapport.html
            fiche.html

  windows-build:
    name: Exécutables Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller pillow -r requirements.txt
      - name: Icône
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/make_icon.py build/atlas-pc-monitor.ico
      - name: Dossier (onedir)
        run: pyinstaller atlas_pc.spec --noconfirm
      - name: Lancer le dossier construit
        shell: pwsh
        run: |
          # Exécutable fenêtré : on attend explicitement la fin du processus.
          # Windowed executable: the end of the process is awaited explicitly.
          $p = Start-Process -FilePath dist\AtlasPCMonitor\AtlasPCMonitor.exe -ArgumentList "--json", "-o", "built.json" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "AtlasPCMonitor.exe (dossier) a renvoyé $($p.ExitCode)" }
          python tools/check_scan.py built.json
          Compress-Archive -Path dist\AtlasPCMonitor -DestinationPath AtlasPCMonitor-windows.zip
      - name: Fichier unique (onefile)
        env:
          ATLAS_ONEFILE: "1"
        run: pyinstaller atlas_pc.spec --noconfirm
      - name: Lancer le fichier unique
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\AtlasPCMonitor.exe -ArgumentList "--json", "-o", "onefile.json" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "AtlasPCMonitor.exe (fichier unique) a renvoyé $($p.ExitCode)" }
          python tools/check_scan.py onefile.json
          Get-Item dist\AtlasPCMonitor.exe, AtlasPCMonitor-windows.zip | Format-Table Name, @{n="Mo"; e={[math]::Round($_.Length / 1MB, 1)}}
      - uses: actions/upload-artifact@v4
        with:
          name: AtlasPCMonitor-windows
          path: |
            AtlasPCMonitor-windows.zip
            dist/AtlasPCMonitor.exe

  linux-appimage:
    name: AppImage Linux
    # Ubuntu 22.04 (glibc 2.35) : l'AppImage tourne sur toutes les distributions au moins aussi récentes.
    # Ubuntu 22.04 (glibc 2.35): the AppImage runs on every distribution at least as recent.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliothèques X11 de Qt (embarquées) et outils
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q squashfs-tools xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libegl1
      - run: python -m pip install pyinstaller pytest -r requirements.txt
      - run: tools/build_appimage.sh
      - name: Essayer l'AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"  # les machines de la CI n'ont pas FUSE — the CI machines have no FUSE
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "tests")
          from conftest import PAYLOAD
          from atlas import collect, export
          collect.is_windows = lambda: True
          data = collect.scan(runner=lambda: (0, json.dumps(PAYLOAD), ""))
          open("exemple.json", "w", encoding="utf-8").write(export.to_json(data))
          PY
          app=$(ls dist/AtlasPCMonitor-*-x86_64.AppImage)
          "$app" --version
          "$app" --text exemple.json | grep -q "CONSTATS"
          "$app" --fiche exemple.json -o fiche.html && grep -q "Fiche d'intervention" fiche.html
          # Interface sur un vrai serveur X : elle doit s'ouvrir et rester ouverte.
          # Interface on a real X server: it must open and stay open.
          xvfb-run -a sh -c "\"$app\" exemple.json & pid=\$!; sleep 10; kill -0 \$pid && kill \$pid"
          ls -la "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: AtlasPCMonitor-linux-appimage
          path: dist/AtlasPCMonitor-*-x86_64.AppImage


  release:
    name: Publication (tag v*)
    # Un tag « v3.0.0 » poussé publie une release GitHub avec les exécutables vérifiés plus haut.
    # Pushing a "v3.0.0" tag publishes a GitHub release with the executables checked above.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows-tests, windows-scan, windows-build, linux-appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artefacts artefacts/dist || true
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Atlas PC Monitor ${GITHUB_REF_NAME#v}" \
            --notes "AtlasPCMonitor.exe : fichier unique pour Windows 10/11, à lancer directement.
          AtlasPCMonitor-windows.zip : même application en dossier, démarrage plus rapide et moins d'alertes antivirus.
          AppImage : visionneuse de rapports pour Linux (glibc 2.35 ou plus)." \
            artefacts/dist/AtlasPCMonitor.exe artefacts/AtlasPCMonitor-windows.zip artefacts/AtlasPCMonitor-*-x86_64.AppImage

# Mises à jour proposées chaque mois : actions de la CI et dépendances Python.
# Monthly update proposals: CI actions and Python dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    # Ne relève pas les minimums (PySide6>=6.5) : Python 3.9 doit rester pris en charge.
    # Does not raise the minimums (PySide6>=6.5): Python 3.9 must stay supported.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: monthly
